name: Gerar APK do Vivaro

# Só corre quando clica em "Run workflow" (Actions → Gerar APK do Vivaro).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar a app web (para dentro do APK)
        env:
          VITE_BASE: "./"
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Aplicar o código nativo do Vivaro
        run: python3 native/apply-android.py

      - name: Sincronizar a app web com o Android
        run: npx cap sync android

      - name: Usar a chave de assinatura fixa (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp native/vivaro-debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vivaro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vivaro-apk
          path: vivaro.apk
          retention-days: 30
